server {
    listen 80;
    listen [::]:80;
    server_name de11.wayspn.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name de11.wayspn.com;

    ssl_certificate /etc/letsencrypt/live/de11.wayspn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/de11.wayspn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 0;
    root /var/www/de11-cover;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Health-check is available only from the server itself.
    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        root /var/lib/de11-health;
        try_files /health.txt =404;
        default_type text/plain;
        access_log off;
    }

    # XHTTP transport. Keep this block independent from the public website.
    location ^~ /assets/app/ {
        proxy_pass http://127.0.0.1:10085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;

        add_header Cache-Control "no-store" always;
    }

    location = / {
        limit_except GET HEAD { deny all; }
        try_files /index.html =404;
    }

    location ^~ /assets/site/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        access_log off;
    }

    location = /favicon.svg {
        limit_except GET HEAD { deny all; }
        try_files /favicon.svg =404;
        expires 7d;
        access_log off;
    }

    location = /robots.txt {
        limit_except GET HEAD { deny all; }
        try_files /robots.txt =404;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    # Unknown public paths are not routed to the application or Xray.
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
}
