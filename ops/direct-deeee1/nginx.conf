# WS TLS termination and the local TLS fallback for Xray gRPC REALITY :2083.
# gRPC itself is NOT proxied by Nginx.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 80;
    listen [::]:80;
    server_name deeee1.wayspn.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/direct-deeee1-acme;
        try_files $uri =404;
    }
    location / { return 301 https://deeee1.wayspn.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deeee1.wayspn.com;
    ssl_certificate /etc/letsencrypt/live/deeee1.wayspn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deeee1.wayspn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DIRECT_DEEEE1:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/direct-deeee1-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    if ($host != deeee1.wayspn.com) { return 444; }
    if ($ssl_server_name != deeee1.wayspn.com) { return 444; }
    location ^~ /direct/ws/ {
        proxy_pass http://127.0.0.1:10088;
        proxy_http_version 1.1;
        proxy_set_header Host deeee1.wayspn.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control no-store always;
        access_log off;
    }
    location = /health {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 200 '{"status":"ok"}\n';
    }
    location / { return 404; }
}
