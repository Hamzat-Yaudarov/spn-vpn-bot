# SPN REALITY front guard; deployment @DEPLOYMENT_ID@
# TCP passthrough only: HAProxy has no certificates and never terminates TLS.
global
    user haproxy
    group haproxy
    maxconn 8192
    ulimit-n 65536
    hard-stop-after 120s

defaults
    mode tcp
    timeout connect 3s
    timeout queue 3s
    timeout client 120s
    timeout server 120s
    timeout client-fin 5s
    timeout server-fin 5s
    timeout tunnel 120s

frontend spn_reality_front
    bind 0.0.0.0:443
    maxconn 8192
    tcp-request inspect-delay 5s
    acl complete_client_hello req.ssl_hello_type 1
    tcp-request content accept if complete_client_hello
    tcp-request content reject if WAIT_END
    default_backend spn_reality_core

backend spn_reality_core
    server xray 127.0.0.1:2443 send-proxy-v2 maxconn 8192
