server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 80;
    listen [::]:80;
    server_name node29.prestizh.site;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 301 https://node29.prestizh.site$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name node29.prestizh.site;
    ssl_certificate /etc/letsencrypt/live/node29.prestizh.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/node29.prestizh.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NODE29:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    root /var/www/node29;
    index index.html;
    access_log /var/log/nginx/node29-access.log;
    error_log /var/log/nginx/node29-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ^~ /direct/ws/ {
        proxy_pass http://127.0.0.1:10088;
        proxy_http_version 1.1;
        proxy_set_header Host node29.prestizh.site;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control no-store always;
        access_log off;
    }
    location = /health {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 200 '{"status":"ok"}\n';
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
