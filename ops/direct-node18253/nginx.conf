server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 80;
    listen [::]:80;
    server_name node18253.wayspn.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/direct-node18253-acme;
        try_files $uri =404;
    }
    location / { return 301 https://node18253.wayspn.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name node18253.wayspn.com;
    ssl_certificate /etc/letsencrypt/live/node18253.wayspn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/node18253.wayspn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DIRECT_NODE18253:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    if ($host != node18253.wayspn.com) { return 444; }
    if ($ssl_server_name != node18253.wayspn.com) { return 444; }

    location = /spngrpc/Tun {
        grpc_pass grpc://127.0.0.1:10087;
        grpc_set_header Host node18253.wayspn.com;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $remote_addr;
        grpc_set_header X-Forwarded-Proto https;
        grpc_set_header Forwarded "";
        grpc_connect_timeout 5s;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
        grpc_next_upstream off;
        client_max_body_size 0;
        client_body_timeout 3600s;
    }
    location ^~ /direct/ws/ {
        proxy_pass http://127.0.0.1:10088;
        proxy_http_version 1.1;
        proxy_set_header Host node18253.wayspn.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control no-store always;
    }
    location = /health {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 200 '{"status":"ok"}\n';
    }
    location / { return 404; }
}
