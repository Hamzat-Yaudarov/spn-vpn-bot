server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name ch121.wayspn.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/direct-ch121-acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
