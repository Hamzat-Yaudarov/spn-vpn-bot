services:
  remnanode:
    container_name: remnanode
    hostname: remnanode
    image: remnawave/node:3.4.1@sha256:0cdf386dd49f360fc885bb34bde21132e478e40f0deac62d616086ec0fa9257e
    restart: unless-stopped
    network_mode: host
    env_file:
      - node.env
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
