# Fixed Poland HTTP bootstrap. Certificate issuance is a separate owner action.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name pol.tekst.site;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/direct-pol-acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
