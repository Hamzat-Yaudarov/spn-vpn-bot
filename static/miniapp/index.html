<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Way SPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/app/assets/app.css?v=20261013-minimal" />
  </head>
  <body class="view-subs-active">
    <div class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Way SPN</p>
          <p id="userLine" class="muted skeleton-text" aria-label="Загрузка"></p>
        </div>
        <div id="userAvatar" class="avatar skeleton-avatar" aria-hidden="true"></div>
      </header>

      <main id="main-content" aria-label="Личный кабинет">
        <section id="view-subs" class="view active" aria-label="Мой VPN">
          <div class="loading-dashboard" role="status" aria-label="Загрузка подписок" aria-busy="true">
            <span class="skeleton-block loading-wide"></span>
            <span class="skeleton-block loading-wide"></span>
          </div>
        </section>
        <section id="view-buy" class="view" aria-label="Купить подписку"></section>
        <section id="view-ref" class="view" aria-label="Заработать"></section>
        <section id="view-help" class="view" aria-label="Помощь"></section>
        <section id="view-payment-result" class="view" aria-label="Результат оплаты"></section>
      </main>

      <nav class="tabbar" aria-label="Разделы кабинета">
        <button type="button" class="tab active" data-view="subs" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4 3 7 8 9 5-2 8-5 8-9V6z"/><path d="m8 12 3 3 5-6"/></svg><span>Мой VPN</span></button>
        <button type="button" class="tab" data-view="buy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 13H6z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg><span>Купить</span></button>
        <button type="button" class="tab" data-view="ref"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2M7 3h10"/></svg><span>Заработать</span></button>
        <button type="button" class="tab" data-view="help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.2 2.1c-.8.4-1 1-1 1.9m0 4h.01"/></svg><span>Помощь</span></button>
      </nav>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="/app/assets/app.js?v=20261013-minimal"></script>
  </body>
</html>
